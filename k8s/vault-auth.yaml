---
# VSO secrets wiring (berget-internal appRole pattern, same as hookshot).
#
# Bootstrapping the appRole is a one-time ops step (done by hand against the
# OpenBao instance, policy read-only on this one path). The roleId below is a
# PLACEHOLDER — fill after running the runbook steps in README.md; secretId is
# seeded into the <name>-approle-credentials Secret by the same runbook.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: meeting-transcriber-auth
  namespace: meeting-transcriber
spec:
  appRole:
    roleId: "REPLACE_WITH_ROLE_ID"
    secretRef: meeting-transcriber-approle-credentials
  method: appRole
  mount: approle
  vaultConnectionRef: vault-secrets-operator-system/default

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: meeting-transcriber-secrets
  namespace: meeting-transcriber
spec:
  vaultAuthRef: meeting-transcriber-auth
  mount: secret
  type: kv-v2
  path: meeting-transcriber/app
  refreshAfter: 60s
  destination:
    create: true
    name: meeting-transcriber-secrets
  # Keys pass through by name — OpenBao path stores exactly
  # MATRIX_ACCESS_TOKEN and BERGET_API_KEY (see README runbook).
