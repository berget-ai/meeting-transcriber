apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: meeting-transcriber

resources:
  - ../../base
  - ../../../namespace.yaml  # namespace owned by this app (no infra-side copy)

images:
  - name: ghcr.io/berget-ai/meeting-transcriber
    newTag: 0.0.1-rc.0

labels:
  - pairs:
      environment: production
    includeSelectors: false
